plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ciweihaha.tvappstore'
    // compileSdk 36：core-ktx 1.17.0 的 AAR 元数据要求至少用 API 36 编译；
    // 只影响编译期可用 API，不影响 targetSdk（35）和 minSdk（21）。
    compileSdk 36

    defaultConfig {
        applicationId "com.ciweihaha.tvappstore"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试包：不签名、不混淆
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AGP 9 内置 Kotlin：android.kotlinOptions 已移除，改用 compilerOptions。
// JVM 17 字节码由 D8 脱糖，minSdk 21 的设备照常运行。
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // 注意：core-ktx 1.18.0+ 和 appcompat 1.8.0 要求 minSdk 23，
    // 下面是仍支持 minSdk 21 的最新版（2026-11-12 核实过各 AAR 的 uses-sdk）。
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.code.gson:gson:2.15.0'

    testImplementation 'junit:junit:4.13.2'
}
