// Top-level build file. Versions are pinned here so CI builds are reproducible.
//
// AGP 9.x 内置 Kotlin 支持：不要再应用 org.jetbrains.kotlin.android，
// AGP 9 会直接报错（"The 'org.jetbrains.kotlin.android' plugin is no longer required"）。
// Kotlin 版本由 AGP 内置的 KGP 决定（AGP 9.5.1 内置 KGP 2.2.10）。
plugins {
    id 'com.android.application' version '9.5.1' apply false
}
