<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV 应用商店</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --text: #e8eaf0;
    --muted: #9aa0ae;
    --accent: #4ade80;
    --accent-dark: #22c55e;
    --chip: #262a35;
    --chip-active: #14532d;
    --border: #2c313d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    padding: 28px 20px 18px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 { font-size: 28px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .subtitle a { color: var(--accent); text-decoration: none; }
  .subtitle a:hover { text-decoration: underline; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(15, 17, 21, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .toolbar-inner { max-width: 1200px; margin: 0 auto; }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  #search {
    flex: 1;
    min-width: 200px;
    padding: 11px 14px;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  #search:focus { border-color: var(--accent-dark); }
  #sort {
    padding: 11px 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    padding: 7px 14px;
    font-size: 14px;
    background: var(--chip);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent-dark); }
  .chip.active { background: var(--chip-active); border-color: var(--accent-dark); }
  .chip .count { color: var(--muted); font-size: 12px; margin-left: 4px; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  #status { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  #status.error { color: #f87171; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 0.15s, transform 0.15s;
  }
  .card:hover { background: var(--card-hover); }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .icon {
    width: 56px; height: 56px;
    flex-shrink: 0;
    border-radius: 12px;
    background: #2c313d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .card-title { min-width: 0; }
  .card-title h3 {
    font-size: 16px;
    font-weight: 600;
    word-break: break-word;
  }
  .card-title .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    margin-top: 6px;
  }
  .pkg {
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .dl {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #06281a;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
  }
  .dl:hover { background: var(--accent-dark); }
  .sha-btn {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
    background: var(--chip);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .sha-btn:hover { color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 16px; }
  footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #262a35;
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>TV 应用商店 <span>📺</span></h1>
  <p class="subtitle">
    免费 TV 应用合集 · 数据来自
    <a href="https://github.com/ciweihaha/tvapp_store" target="_blank" rel="noopener">tvapp_store</a> 与
    <a href="https://github.com/ciweihaha/tvapp-xyzzb" target="_blank" rel="noopener">tvapp-xyzzb</a> ·
    目录更新于 <span id="generated">—</span>
  </p>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-row">
      <input id="search" type="search" placeholder="搜索应用名、包名或文件名…" autocomplete="off">
      <select id="sort" aria-label="排序">
        <option value="name">按名称</option>
        <option value="size-desc">按大小 ↓</option>
        <option value="size-asc">按大小 ↑</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div id="status">正在加载目录…</div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span>原始文件库：</span>
  <a href="/tvapp_store/">tvapp_store 目录</a>
  <a href="/tvapp-xyzzb/">tvapp-xyzzb 目录</a>
  <a href="/catalog.json">catalog.json</a>
  <a href="/catalog-all.json">catalog-all.json（全部版本）</a>
  <a href="https://github.com/ciweihaha/tvapp-store" target="_blank" rel="noopener">源码</a>
</footer>

<div id="toast"></div>

<script>
let APPS = [];
let CATALOG = null;
let state = { q: "", cat: "全部", sort: "name" };

function fmtSize(bytes) {
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + " KB";
  return bytes + " B";
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2000);
}

function copySha(sha) {
  const done = () => toast("SHA256 已复制");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(sha).then(done, () => toast("复制失败"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = sha;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败"); }
    document.body.removeChild(ta);
  }
}

function renderChips() {
  const counts = {};
  for (const a of APPS) counts[a.category] = (counts[a.category] || 0) + 1;
  const cats = ["全部", ...Object.keys(counts).sort((x, y) => counts[y] - counts[x])];
  const el = document.getElementById("chips");
  el.innerHTML = cats.map(c => {
    const n = c === "全部" ? APPS.length : counts[c];
    return `<button class="chip${state.cat === c ? " active" : ""}" data-cat="${esc(c)}">${esc(c)}<span class="count">${n}</span></button>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(b => {
    b.addEventListener("click", () => { state.cat = b.dataset.cat; renderChips(); render(); });
  });
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = APPS.filter(a => {
    if (state.cat !== "全部" && a.category !== state.cat) return false;
    if (!q) return true;
    return (a.label || "").toLowerCase().includes(q)
      || (a.package || "").toLowerCase().includes(q)
      || (a.file || "").toLowerCase().includes(q);
  });
  if (state.sort === "name") {
    list.sort((a, b) => (a.label || "").localeCompare(b.label || "", "zh"));
  } else if (state.sort === "size-desc") {
    list.sort((a, b) => b.size - a.size);
  } else if (state.sort === "size-asc") {
    list.sort((a, b) => a.size - b.size);
  }
  return list;
}

function render() {
  const list = filtered();
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  status.textContent = `共 ${APPS.length} 个应用 · 当前显示 ${list.length} 个` +
    (CATALOG && CATALOG.stats ? `（原始 APK ${CATALOG.stats.total_apks} 个，已按包名去重）` : "");
  if (!list.length) {
    grid.innerHTML = `<div class="empty">没有找到匹配的应用，换个关键词试试。</div>`;
    return;
  }
  grid.innerHTML = list.map(a => {
    const icon = a.icon
      ? `<img src="${esc(a.icon)}" alt="" loading="lazy" onerror="this.parentElement.textContent='${esc((a.label || "?")[0])}'">`
      : esc((a.label || "?")[0]);
    const ver = a.versionName ? `v${esc(a.versionName)}` : "";
    return `<article class="card">
      <div class="card-top">
        <div class="icon">${icon}</div>
        <div class="card-title">
          <h3>${esc(a.label)}</h3>
          <div class="meta">${ver} · ${fmtSize(a.size)}</div>
          <span class="badge">${esc(a.category)}</span>
        </div>
      </div>
      <div class="pkg">${esc(a.package || "")}</div>
      <div class="actions">
        <a class="dl" href="${esc(a.url)}" download>下载 APK</a>
        <button class="sha-btn" data-sha="${esc(a.sha256)}" title="复制 SHA256">SHA256</button>
      </div>
    </article>`;
  }).join("");
  grid.querySelectorAll(".sha-btn").forEach(b => {
    b.addEventListener("click", () => copySha(b.dataset.sha));
  });
}

document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value;
  render();
});
document.getElementById("sort").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

fetch("catalog.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    CATALOG = data;
    APPS = data.apps || [];
    const gen = document.getElementById("generated");
    if (data.generated_at) {
      gen.textContent = new Date(data.generated_at).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" });
    }
    renderChips();
    render();
  })
  .catch(err => {
    const status = document.getElementById("status");
    status.className = "error";
    status.textContent = "目录加载失败：" + err.message + "，请稍后刷新重试。";
  });
</script>
</body>
</html>
